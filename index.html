<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>St. John Apostolic Faith Mission Church</title>
  <meta name="description" content="One church worshiping Jesus and making His name known in our city and world.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#191970">
  <link rel="apple-touch-icon" href="icon01.png">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- colours I use everywhere ---------- */
    :root {
      --navy: #191970;
      --bg: #fff;
      --soft: #f3f4fb;
      --ink: #1b1b2f;
      --mute: #5b5d78;
      --line: #dfe1f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 17px/1.6 "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    h1, h2, h3 {
      font-family: Fraunces, Georgia, serif;
      line-height: 1.15;
      margin: 0 0 .5em;
      color: var(--navy);
    }

    h1 { font-size: clamp(2.4rem, 7vw, 4.6rem); }
    h2 { font-size: clamp(1.7rem, 4vw, 2.6rem); }
    h3 { font-size: 1.3rem; }

    a { color: var(--navy); }
    img { max-width: 100%; display: block; }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    section { padding: 64px 0; }
    .soft { background: var(--soft); }

    /* ---------- top bar ---------- */
    /* header floats over the big picture */
    #top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
    }

    nav {
      background: transparent;
      color: #fff;
      border-bottom: 1px solid #fff;
      transition: background .3s;
    }

    /* once you scroll (or the page has no big picture) the header turns solid blue */
    #top.solid nav {
      background: var(--navy);
    }

    /* pages with no big picture need space so the header doesn't cover the title */
    main.no-hero {
      padding-top: 68px;
    }

    nav .wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 68px;
    }

    nav .logo {
      margin-right: auto;
      display: flex;
      color: #fff;
      font: 700 1.2rem Fraunces, serif;
      text-decoration: none;
    }

    nav .logo img {
      height: 46px;
      width: auto;
    }

    nav .btn {
      background: #fff;
      color: var(--navy);
      border-color: #fff;
      padding: 6px 20px;
      text-decoration: none;
    }

    /* the three-line menu button */
    .burger {
      background: none;
      border: 0;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: grid;
      place-content: center;
      gap: 6px;
    }

    .burger i {
      display: block;
      width: 26px;
      height: 3px;
      background: #fff;
      border-radius: 2px;
      transition: transform .25s, opacity .25s;
    }

    /* turns into an X when the menu is open */
    .burger.open i:nth-child(1) { transform: translateY(9px) rotate(45deg); }
    .burger.open i:nth-child(2) { opacity: 0; }
    .burger.open i:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

    .menu {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 14px 24px rgba(25, 25, 112, .18);
      max-height: calc(100vh - 68px);
      overflow: auto;
    }

    .menu.open { display: block; }

    .menu .wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 24px;
      padding-top: 28px;
      padding-bottom: 28px;
    }

    .menu h3 {
      font: 600 .95rem "Source Sans 3", sans-serif;
      color: var(--mute);
      margin-bottom: 6px;
    }

    .menu a {
      display: block;
      color: var(--navy);
      padding: 6px 0;
      font-size: 1.15rem;
      text-decoration: none;
      font-weight: 600;
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-block;
      background: var(--navy);
      color: #fff;
      border: 2px solid var(--navy);
      padding: 10px 22px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }

    .btn.ghost { background: #fff; color: var(--navy); }
    .btn.sm { padding: 5px 14px; font-size: .9rem; }

    .btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    /* ---------- big top banner ---------- */
    .hero {
      background: var(--navy);
      color: #fff;
      padding: 150px 0;
    }

    .hero h1, .hero p { color: #fff; }
    .hero h1 span { display: block; }
    .hero .btn { background: #fff; color: var(--navy); border-color: #fff; }
    .hero .btn.ghost { background: transparent; color: #fff; }

    /* text on one side, picture on the other */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .split img {
      border-radius: 14px;
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    /* picture slideshow */
    .slides {
      position: relative;
      aspect-ratio: 16/7;
      overflow: hidden;
      background: var(--soft);
    }

    .slides img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s;
    }

    .slides img.on { opacity: 1; }

    /* ---------- event cards ---------- */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      display: flex;
      gap: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      color: var(--ink);
    }

    .card:hover { border-color: var(--navy); }

    .date {
      min-width: 62px;
      text-align: center;
      background: var(--navy);
      color: #fff;
      border-radius: 10px;
      padding: 8px 4px;
      font-weight: 600;
      line-height: 1.1;
      align-self: flex-start;
    }

    .date b {
      display: block;
      font: 700 1.6rem Fraunces, serif;
    }

    /* ---------- coloured bands ---------- */
    .band {
      background: var(--navy);
      color: #fff;
      text-align: center;
    }

    .band h2, .band p { color: #fff; }
    .band .btn { background: #fff; color: var(--navy); }

    .series {
      position: relative;
      color: #fff;
      background: var(--navy) center/cover;
    }

    /* dark blue layer on top of the series picture */
    .series:before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(25, 25, 112, .78);
    }

    .series .wrap { position: relative; }
    .series h2, .series p { color: #fff; }
    .series .btn { background: #fff; color: var(--navy); }

    ul.tick { padding-left: 20px; }

    /* pastors */
    .circles {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      text-align: center;
    }

    .circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--navy);
      background: var(--soft);
      margin: 0 auto 12px;
    }

    /* ---------- footer ---------- */
    footer {
      background: var(--navy);
      color: #fff;
      border-top: 4px solid #fff;
      font-size: .95rem;
    }

    .fgrid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr;
      gap: 48px;
      padding-top: 64px;
      padding-bottom: 48px;
    }

    .fbrand img {
      height: 60px;
      width: auto;
      margin-bottom: 16px;
    }

    .fbrand h3 {
      color: #fff;
      margin-bottom: 12px;
    }

    .fbrand p {
      max-width: 340px;
      margin: 0;
      color: rgba(255, 255, 255, .8);
    }

    footer h4 {
      margin: 0 0 16px;
      font: 600 .8rem "Source Sans 3", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .6);
    }

    footer ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    footer li { margin-bottom: 10px; }

    footer a {
      color: #fff;
      text-decoration: none;
      opacity: .9;
    }

    footer a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .fbar {
      border-top: 1px solid rgba(255, 255, 255, .2);
    }

    .fbar .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 20px;
      padding-bottom: 20px;
      font-size: .88rem;
      color: rgba(255, 255, 255, .7);
    }

    .totop {
      background: none;
      border: 1px solid rgba(255, 255, 255, .5);
      color: #fff;
      border-radius: 999px;
      padding: 6px 16px;
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
    }

    .totop:hover { background: #fff; color: var(--navy); }

    /* ---------- calendar ---------- */
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal div {
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px;
      font-size: .85rem;
      overflow: hidden;
    }

    .cal .h {
      min-height: 0;
      border: 0;
      font-weight: 600;
      text-align: center;
      color: var(--mute);
    }

    .cal a {
      display: block;
      background: var(--navy);
      color: #fff;
      border-radius: 4px;
      padding: 1px 5px;
      margin-top: 2px;
      font-size: .78rem;
      text-decoration: none;
    }

    .calhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    /* ---------- sunday readings ---------- */
    .read {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 6px 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .read.now {
      background: var(--soft);
      padding-left: 10px;
    }

    .read small { color: var(--mute); }

    /* ---------- admin forms ---------- */
    input, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      margin: 3px 0 10px;
    }

    label {
      font-weight: 600;
      font-size: .9rem;
    }

    .row {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .msg { color: var(--mute); }
    .pre { white-space: pre-wrap; }

    /* phones */
    @media (max-width: 760px) {
      .split { grid-template-columns: 1fr; }
      .fgrid { grid-template-columns: 1fr; gap: 32px; }
      .read { grid-template-columns: 1fr; }
      .cal div { min-height: 54px; }
    }

    /* people who don't like animation */
    @media (prefers-reduced-motion: reduce) {
      .slides img { transition: none; }
    }
  </style>
</head>

    };

    // pictures for the slideshow if I haven't added any in admin yet
    const fallbackSlideNames = [
      "68fa56a15d7ac8626153654e_home-carousel-slide-1",
      "68fa56aa91137825dc40f1a9_home-carousel-slide-2",
      "68fa56b14b2f26d56ea2c62d_home-carousel-slide-3",
      "68fa56ba6e6c4fcedde8b5c3_home-carousel-slide-4",
      "68fa56c23a6de895bcd70436_home-carousel-slide-5",
      "68fa56ca9180293a460cd248_home-carousel-slide-6"
    ];
    const fallbackSlides = fallbackSlideNames.map((name, number) => {
      return { image_url: imgHost + name + ".webp", sort: number };
    });


    // ---------- small helper functions ----------

    // grab something from the page
    function pick(selector) {
      return document.querySelector(selector);
    }

    // makes text safe to put inside HTML (stops weird characters breaking the page)
    function safe(text) {
      const swaps = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(text ?? "").replace(/[&<>"']/g, character => swaps[character]);
    }

    // turns lines of text into a bullet list
    function makeList(text) {
      return String(text || "")
        .split("\n")
        .filter(Boolean)
        .map(line => `<li>${safe(line)}</li>`)
        .join("");
    }

    // a date turned into 2026-11-17 so dates are easy to compare
    function toDateKey(date) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;
    }

    // nice looking date, South African style
    function formatDate(dateText, options) {
      const defaultLook = { day: "numeric", month: "long", year: "numeric" };
      return new Date(dateText + "T00:00:00").toLocaleDateString("en-ZA", options || defaultLook);
    }


    // ---------- things the page remembers ----------
    const db = (SUPABASE_URL.startsWith("http") && window.supabase)
      ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    let site = { ...defaultText };      // the words/pictures being shown right now
    let slides = fallbackSlides;
    let events = [];
    let readings = [];
    let session = null;                 // filled in when the admin logs in
    let calendarMonth = new Date();
    let slideTimer;


    // get everything from Supabase
    async function loadEverything() {
      if (!db) return;

      try {
        const [texts, eventRows, slideRows, readingRows] = await Promise.all([
          db.from("site_content").select("*"),
          db.from("events").select("*").order("event_date"),
          db.from("slides").select("*").order("sort"),
          db.from("readings").select("*").order("sunday_date")
        ]);

        // saved text replaces the starting text (empty ones are ignored)
        (texts.data || []).forEach(row => {
          if (row.value !== null && row.value !== "") {
            site[row.key] = row.value;
          }
        });

        events = eventRows.data || [];
        readings = readingRows.data || [];
        if ((slideRows.data || []).length) {
          slides = slideRows.data;
        }

        session = (await db.auth.getSession()).data.session;
      } catch (error) {
        console.error(error);
      }
    }


    // ---------- the pages ----------

    // one event card (used on home page)
    function eventCard(event) {
      const dayNumber = new Date(event.event_date + "T00:00:00").getDate();
      const monthName = formatDate(event.event_date, { month: "short" });

      return `
        <a class="card" href="#/event/${event.id}">
          <div class="date"><b>${dayNumber}</b>${monthName}</div>
          <div>
            <h3>${safe(event.title)}</h3>
            <span class="msg">${safe(event.short_description)}</span>
          </div>
        </a>`;
    }

    function homePage() {
      const today = toDateKey(new Date());
      const comingUp = events.filter(event => event.event_date >= today).slice(0, 6);

        return `<img class="${number ? "" : "on"}" src="${safe(slide.image_url)}" alt="">`;
      }).join("");

      const eventCards = comingUp.map(eventCard).join("")
        || '<p class="msg">New events will appear here soon.</p>';

      return `
        <header class="hero" style="background:linear-gradient(rgba(25,25,112,.55),rgba(25,25,112,.75)),url('${safe(site.hero_img)}') center/cover">
          <div class="wrap">
            <h1>
              <span>${safe(site.hero1)}</span>
              <span>${safe(site.hero2)}</span>
              <span>${safe(site.hero3)}</span>
              <span>${safe(site.hero4)}</span>
            </h1>
            <p>${safe(site.hero_invite)}</p>

    function eventPage(eventId) {
      const event = events.find(item => String(item.id) === String(eventId));

      if (!event) {
        return `
          <section>
            <div class="wrap">
              <h2>Event not found</h2>
              <a href="#/calendar">Back to calendar</a>
            </div>
          </section>`;
      }

      const longDate = formatDate(event.event_date, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      const picture = event.image_url
        ? `<img src="${safe(event.image_url)}" alt="" style="border-radius:14px;margin:20px 0">`
        : "";

      return `
        <section>
          <div class="wrap" style="max-width:780px">
            <a href="#/calendar">← Back to calendar</a>
            <p class="msg" style="margin-top:20px">${longDate}</p>
            <h1>${safe(event.title)}</h1>
            ${picture}
            <p class="pre">${safe(event.full_description || event.short_description)}</p>
          </div>
        </section>`;
    }


    function calendarPage() {
      // people can only look 6 months back and 6 months ahead
      const now = new Date();
      const earliest = new Date(now.getFullYear(), now.getMonth() - 6, 1);
      const latest = new Date(now.getFullYear(), now.getMonth() + 6, 1);

      if (calendarMonth < earliest) calendarMonth = earliest;
      if (calendarMonth > latest) calendarMonth = latest;

      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();      // 0 = Sunday
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // top row: Sun Mon Tue...
      const weekdayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      let cells = weekdayNames.map(name => `<div class="h">${name}</div>`).join("");

      // empty boxes before the 1st so the dates line up under the right weekday
      cells += "<div style='border:0'></div>".repeat(firstWeekday);

      // one box for every day of the month
      for (let day = 1; day <= daysInMonth; day++) {
        const dayKey = toDateKey(new Date(year, month, day));
        const eventsToday = events
          .filter(event => event.event_date === dayKey)
          .map(event => `<a href="#/event/${event.id}">${safe(event.title)}</a>`)
          .join("");

        cells += `<div><b>${day}</b>${eventsToday}</div>`;
      }

      const monthLook = { month: "long", year: "numeric" };
      const monthTitle = calendarMonth.toLocaleDateString("en-ZA", monthLook);
      const fromText = earliest.toLocaleDateString("en-ZA", monthLook);
      const toText = latest.toLocaleDateString("en-ZA", monthLook);

      return `
        <section>
          <div class="wrap">
            <h1>Church Calendar</h1>
            <div class="calhead">
              <button class="btn sm" data-act="prev" ${calendarMonth <= earliest ? "disabled" : ""}>← Previous</button>
              <h2 style="margin:0">${monthTitle}</h2>
              <button class="btn sm" data-act="next" ${calendarMonth >= latest ? "disabled" : ""}>Next →</button>
            </div>
            <div class="cal">${cells}</div>
            <p class="msg">Showing events from ${fromText} to ${toText}.</p>
          </div>
        </section>`;
    }


    function readingsPage() {
      const today = toDateKey(new Date());
      let foundThisSunday = false;   // only the first upcoming Sunday gets highlighted

      const rows = readings.map(reading => {
        const isThisSunday = !foundThisSunday && reading.sunday_date >= today;
        if (isThisSunday) foundThisSunday = true;

        const dateText = formatDate(reading.sunday_date, { day: "numeric", month: "short", year: "numeric" });
        const label = isThisSunday ? "<br><small>This Sunday</small>" : "";
        const notes = reading.notes ? `<br><small>${safe(reading.notes)}</small>` : "";

        return `
          <div class="read ${isThisSunday ? "now" : ""}">
            <div><b>${dateText}</b>${label}</div>
            <div>${safe(reading.scripture)}${notes}</div>
          </div>`;
      }).join("") || '<p class="msg">Readings will appear here.</p>';

      return `
        <section>
          <div class="wrap" style="max-width:780px">
            <h1>${safe(site.series_title)}</h1>
            <p>${safe(site.series_text)}</p>
            <h2>Sunday readings</h2>
            ${rows}
          </div>
        </section>`;
    }


    function appPage() {
      // real button if there's a link, "coming soon" if not
      function storeButton(link, label) {
        if (link) {
          return `<a class="btn" href="${safe(link)}">${label}</a>`;
        }
        return `<span class="btn ghost" style="opacity:.5">${label} — coming soon</span>`;
      }

      return `
        <section>
          <div class="wrap" style="max-width:780px">
            <h1>Get the app</h1>
            <p>Events, the calendar, and Sunday readings in your pocket.</p>
            <div class="btns">
              ${storeButton(site.android_url, "Download for Android")}
              ${storeButton(site.ios_url, "Download for iPhone")}
            </div>
          </div>

    }


    // ---------- login + admin ----------

    function loginPage() {
      return `
        <section>
          <div class="wrap" style="max-width:420px">
            <h1>Admin login</h1>
            <label>Email</label>
            <input id="em" type="email" autocomplete="username">
            <label>Password</label>
            <input id="pw" type="password" autocomplete="current-password">
            <button class="btn" data-act="login">Log in</button>
            <p class="msg" id="lmsg"></p>
          </div>
        </section>`;
    }

    // which boxes show up for each table in admin
    const adminFields = {
      events: [["title"], ["event_date", "date"], ["short_description", "area"], ["full_description", "area"], ["image_url", "img"]],
      slides: [["image_url", "img"], ["sort", "number"]],
      readings: [["sunday_date", "date"], ["scripture"], ["notes", "area"]]
    };

    // how each table is sorted
    const adminSortBy = { events: "event_date", slides: "sort", readings: "sunday_date" };

    // builds one label + box in the admin page
    function makeField(name, type, value, prefix = "") {
      const text = safe(value);
      const dataName = `data-f="${prefix}${name}"`;
      const label = `<label>${name.replace(/_/g, " ")}</label>`;

      if (type === "area") {
        return `${label}<textarea rows="4" ${dataName}>${text}</textarea>`;
      }
      if (type === "img") {
        return `${label}<input ${dataName} value="${text}" placeholder="Image link or upload below"><input type="file" accept="image/*,video/*" data-up>`;
      }
      return `${label}<input ${dataName} type="${type || "text"}" value="${text}">`;
    }

    async function adminPage(tab = "texts") {
      // not logged in? send to login
      if (!db || !session) return loginPage();

      const tabNames = ["texts", "events", "slides", "readings"];
      const tabButtons = tabNames.map(name => {
        const title = name === "texts" ? "Page text & images" : name[0].toUpperCase() + name.slice(1);
        return `<button class="btn sm ${name === tab ? "" : "ghost"}" data-act="tab" data-t="${name}">${title}</button>`;
      }).join("");

      let body = "";

      if (tab === "texts") {
        // every setting from defaultText gets its own box
        body = Object.keys(defaultText).map(key => {
          let type = "text";
          if (/_img$/.test(key)) type = "img";
          else if (defaultText[key].length > 90 || key === "service_times") type = "area";
          return makeField(key, type, site[key], "t:");
        }).join("");

        body += `<button class="btn" data-act="savetexts">Save all text</button>`;
      } else {
        const { data } = await db.from(tab).select("*").order(adminSortBy[tab]);

        // one editable row for each thing already saved
        body = (data || []).map(item => `
          <div class="row" data-id="${item.id}">
            ${adminFields[tab].map(([name, type]) => makeField(name, type, item[name])).join("")}
            <button class="btn sm" data-act="saverow" data-tb="${tab}">Save</button>
            <button class="btn sm ghost" data-act="delrow" data-tb="${tab}">Delete</button>
          </div>`).join("");

        // and an empty one at the bottom for adding something new
        body += `
          <div class="row" data-id="">
            ${adminFields[tab].map(([name, type]) => makeField(name, type, "")).join("")}
            <button class="btn sm" data-act="saverow" data-tb="${tab}">Add new</button>
          </div>`;
      }

      return `
        <section>
          <div class="wrap" style="max-width:820px">
            <h1>Admin</h1>
            <p><button class="btn sm ghost" data-act="logout">Log out</button></p>
            <div class="tabs">${tabButtons}</div>
            ${body}
          </div>
        </section>`;
    }


    // ---------- decides which page to show ----------
    async function showPage() {
      // the address looks like  #/about  or  #/event/5
      const [, pageName, extra] = (location.hash || "#/").slice(1).split("/");

      clearInterval(slideTimer);

      let html;
      switch (pageName) {
        case "about":    html = aboutPage(); break;
        case "visit":    html = visitPage(); break;
        case "event":    html = eventPage(extra); break;
        case "calendar": html = calendarPage(); break;
        case "readings": html = readingsPage(); break;
        case "app":      html = appPage(); break;
        case "login":    html = session ? await adminPage() : loginPage(); break;
        case "admin":    html = await adminPage(extra || "texts"); break;
        default:         html = homePage();
      }

      pick("#app").innerHTML = html;
      window.scrollTo(0, 0);

      // start the slideshow if we're on a page that has one
      const slideImages = document.querySelectorAll("#slides img");
      if (slideImages.length > 1) {
        let current = 0;
        slideTimer = setInterval(() => {
          slideImages[current].classList.remove("on");
          current = (current + 1) % slideImages.length;
          slideImages[current].classList.add("on");
        }, 4500);
      }

      // top bar bits
      pick("#navlogin").textContent = session ? "Admin" : "Admin Login";
      pick("#navlogin").href = session ? "#/admin" : "#/login";
      pick("#navlogo").innerHTML = site.logo_img
        ? `<img src="${safe(site.logo_img)}" alt="${safe(site.hero4)}">`
        : safe(site.hero4);

      // close the menu whenever we change page
      pick("#menu").classList.remove("open");
      pick("#burger").classList.remove("open");

      // pages with a big picture at the top let the header be see-through
      const hasHero = document.querySelector(".hero");
      pick("#app").classList.toggle("no-hero", !hasHero);
      updateHeader();

      // footer
      const footerLogo = site.logo_img
        ? `<img src="${safe(site.logo_img)}" alt="${safe(site.hero4)}">`
        : `<h3>${safe(site.hero4)}</h3>`;

      // only show email / phone / office if they were filled in
      const contactLines = [];
      if (site.email) contactLines.push(`<li><a href="mailto:${safe(site.email)}">${safe(site.email)}</a></li>`);
      if (site.phone) contactLines.push(`<li><a href="tel:${safe(site.phone)}">${safe(site.phone)}</a></li>`);
      if (site.office && site.office.trim()) contactLines.push(`<li>${safe(site.office)}</li>`);
      const contactList = contactLines.join("") || "<li>Contact details coming soon</li>";

      pick("#foot").innerHTML = `
        <div class="wrap fgrid">
          <div class="fbrand">
            ${footerLogo}
            <p>${safe(site.about_lead)}</p>
          </div>
          <div>
            <h4>Explore</h4>
            <ul>
              <li><a href="#/about">About Us</a></li>
              <li><a href="#/visit">Visit Us</a></li>
              <li><a href="#/calendar">Church Calendar</a></li>
              <li><a href="#/readings">Sunday Readings</a></li>
              <li><a href="#/app">Get the App</a></li>
            </ul>
          </div>
          <div>
            <h4>Contact</h4>
            <ul>${contactList}</ul>
          </div>
        </div>
        <div class="fbar">
          <div class="wrap">
            <span>© ${new Date().getFullYear()} ${safe(site.hero4)}. All rights reserved.</span>
            <button class="totop" data-act="top">Back to top ↑</button>
          </div>
        </div>`;
    }


    // ---------- what happens when someone clicks things ----------
    document.addEventListener("click", async event => {
      const button = event.target.closest("[data-act]");
      if (!button) return;

      const action = button.dataset.act;

      // calendar arrows
      if (action === "prev") {
        calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1);
        return showPage();
      }
      if (action === "next") {
        calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1);
        return showPage();
      }

      // back to top button in the footer
      if (action === "top") {
        return window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // admin tabs
      if (action === "tab") {
        return location.hash = "#/admin/" + button.dataset.t;
      }

      // log in
      if (action === "login") {
        if (!db) {
          return pick("#lmsg").textContent = "Supabase is not connected yet. Check the keys in index.html.";
        }

        const { data, error } = await db.auth.signInWithPassword({
          email: pick("#em").value.trim(),
          password: pick("#pw").value
        });

        if (error) {
          return pick("#lmsg").textContent = "Login failed: " + error.message;
        }

        session = data.session;
        return location.hash = "#/admin";
      }

      // log out
      if (action === "logout") {
        await db.auth.signOut();
        session = null;
        return location.hash = "#/";
      }

      // save all the page text at once
      if (action === "savetexts") {
        const boxes = document.querySelectorAll("[data-f^='t:']");
        const rows = [...boxes].map(box => ({
          key: box.dataset.f.slice(2),
          value: box.value
        }));

        const { error } = await db.from("site_content").upsert(rows);
        if (error) return alert("Save failed: " + error.message);

        await loadEverything();
        alert("Saved.");
        return showPage();
      }

      // save or delete one event / slide / reading
      if (action === "saverow" || action === "delrow") {
        const row = button.closest(".row");
        const id = row.dataset.id;
        const table = button.dataset.tb;

        if (action === "delrow") {
          if (!confirm("Delete this item?")) return;
          await db.from(table).delete().eq("id", id);
        } else {
          // collect everything typed in this row (empty boxes become null)
          const values = {};
          row.querySelectorAll("[data-f]").forEach(box => {
            values[box.dataset.f] = box.value === "" ? null : box.value;
          });

          // has an id = update it, no id = it's a new one
          const { error } = id
            ? await db.from(table).update(values).eq("id", id)
            : await db.from(table).insert(values);

          if (error) return alert("Save failed: " + error.message);
        }

        await loadEverything();
        return showPage();
      }
    });

    // uploading a picture from the admin page
    document.addEventListener("change", async event => {
      const box = event.target;
      if (!box.matches("[data-up]") || !box.files[0]) return;

      const file = box.files[0];
      const fileName = Date.now() + "-" + file.name.replace(/[^\w.-]/g, "_");

      const { error } = await db.storage.from("media").upload(fileName, file);
      if (error) return alert("Upload failed: " + error.message);

      // put the picture's link into the box above the file chooser
      const link = db.storage.from("media").getPublicUrl(fileName).data.publicUrl;
      box.previousElementSibling.value = link;
      alert("Uploaded. Now press Save.");
    });

    // menu button opens and closes the dropdown
    pick("#burger").addEventListener("click", () => {
      const isOpen = pick("#menu").classList.toggle("open");
      pick("#burger").classList.toggle("open", isOpen);
      pick("#burger").setAttribute("aria-expanded", isOpen);
      updateHeader();
    });

    // clicking anywhere else closes the menu
    document.addEventListener("click", event => {
      if (!event.target.closest("#top")) {
        pick("#menu").classList.remove("open");
        pick("#burger").classList.remove("open");
        updateHeader();
      }
    });

    // header is see-through at the very top of a page with a big picture,
    // and turns solid blue when you scroll, open the menu, or are on a plain page
    function updateHeader() {
      const hasHero = document.querySelector(".hero");
      const scrolled = window.scrollY > 40;
      const menuOpen = pick("#menu").classList.contains("open");
      pick("#top").classList.toggle("solid", !hasHero || scrolled || menuOpen);
    }
    window.addEventListener("scroll", updateHeader);

    // change page when the address (#/something) changes
    window.addEventListener("hashchange", showPage);

    // start everything
    loadEverything().then(showPage);
  </script>
</body>
</html>
