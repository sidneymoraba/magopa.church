<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Austin Stone Community Church</title>
<meta name="description" content="One church worshiping Jesus and making His name known in our city and world.">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#191970"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#191970;--bg:#fff;--soft:#f3f4fb;--ink:#1b1b2f;--mute:#5b5d78;--line:#dfe1f0}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 "Source Sans 3",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em;color:var(--navy)}
h1{font-size:clamp(2.4rem,7vw,4.6rem)}h2{font-size:clamp(1.7rem,4vw,2.6rem)}h3{font-size:1.3rem}
a{color:var(--navy)}img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:64px 0}.soft{background:var(--soft)}
#top{position:sticky;top:0;z-index:5}
nav{background:var(--navy);color:#fff}
nav .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
nav .logo{margin-right:auto;display:flex;color:#fff;font:700 1.2rem Fraunces,serif;text-decoration:none}nav .logo img{height:46px;width:auto}
nav .btn{background:#fff;color:var(--navy);border-color:#fff;padding:6px 20px;text-decoration:none}
.burger{background:none;border:0;cursor:pointer;width:44px;height:44px;display:grid;place-content:center;gap:6px}
.burger i{display:block;width:26px;height:3px;background:#fff;border-radius:2px;transition:transform .25s,opacity .25s}
.burger.open i:nth-child(1){transform:translateY(9px) rotate(45deg)}.burger.open i:nth-child(2){opacity:0}.burger.open i:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
.menu{display:none;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 14px 24px rgba(25,25,112,.18);max-height:calc(100vh - 68px);overflow:auto}
.menu.open{display:block}
.menu .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;padding-top:28px;padding-bottom:28px}
.menu h3{font:600 .95rem "Source Sans 3",sans-serif;color:var(--mute);margin-bottom:6px}
.menu a{display:block;color:var(--navy);padding:6px 0;font-size:1.15rem;text-decoration:none;font-weight:600}
.btn{display:inline-block;background:var(--navy);color:#fff;border:2px solid var(--navy);padding:10px 22px;border-radius:999px;font:600 1rem inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--navy)}.btn.sm{padding:5px 14px;font-size:.9rem}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.hero{background:var(--navy);color:#fff;padding:150px 0}.hero h1,.hero p{color:#fff}
.hero h1 span{display:block}.hero .btn{background:#fff;color:var(--navy);border-color:#fff}.hero .btn.ghost{background:transparent;color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.split img{border-radius:14px;width:100%;aspect-ratio:4/3;object-fit:cover}
.slides{position:relative;aspect-ratio:16/7;overflow:hidden;background:var(--soft)}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}.slides img.on{opacity:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--navy)}
.date{min-width:62px;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:8px 4px;font-weight:600;line-height:1.1;align-self:flex-start}
.date b{display:block;font:700 1.6rem Fraunces,serif}
.band{background:var(--navy);color:#fff;text-align:center}.band h2,.band p{color:#fff}.band .btn{background:#fff;color:var(--navy)}
.series{position:relative;color:#fff;background:var(--navy) center/cover}
.series:before{content:"";position:absolute;inset:0;background:rgba(25,25,112,.78)}
.series .wrap{position:relative}.series h2,.series p{color:#fff}.series .btn{background:#fff;color:var(--navy)}
ul.tick{padding-left:20px}
.circles{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;text-align:center}
.circle{width:200px;height:200px;border-radius:50%;object-fit:cover;border:4px solid var(--navy);background:var(--soft);margin:0 auto 12px}
footer{background:var(--navy);color:#fff;padding:48px 0;font-size:.95rem}footer a{color:#fff}footer h3{color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:76px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:.85rem;overflow:hidden}
.cal .h{min-height:0;border:0;font-weight:600;text-align:center;color:var(--mute)}
.cal a{display:block;background:var(--navy);color:#fff;border-radius:4px;padding:1px 5px;margin-top:2px;font-size:.78rem;text-decoration:none}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.read{display:grid;grid-template-columns:150px 1fr;gap:6px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.read.now{background:var(--soft);padding-left:10px}.read small{color:var(--mute)}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:3px 0 10px}
label{font-weight:600;font-size:.9rem}
.row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.msg{color:var(--mute)}.pre{white-space:pre-wrap}
@media(max-width:760px){.split{grid-template-columns:1fr}.read{grid-template-columns:1fr}.cal div{min-height:54px}}
@media(prefers-reduced-motion:reduce){.slides img{transition:none}}
</style>
</head>

  about_hero_img:CDN2+"65fc652edfc07fab12b66c95_3269c58d89f5c1a8dfc03509569f8e21_about-hero-slide-1.webp",
  about_established:"Established in 2002", about_lead:"We love God, the church, the city, and the nations.",
  who_title:"One Church, Six Locations",
  who_text:"The Austin Stone is a New Testament church with six congregations that exists for the supremacy of the name and purpose of Jesus. We believe Christ’s life, death, and resurrection are essential to God’s plan to heal and redeem our fallen world, and we're dedicated to being a part of what He’s doing in our city and throughout the nations.",
  convictions:"Ruled by God’s Word\nChrist-Centered in Focus\nEmpowered by the Holy Spirit\nReliant on Prayer\nCommitted to Covenant Community\nGospel-Saturated in Discipleship\nDevoted to Equipping the Saints\nRelentless in Mission",
  faith:"The Bible is the Word of God, fully inspired and without error in the original manuscripts.\nThere is one true, good, and living God who eternally exists in three persons—the Father, Son, and Holy Spirit.\nGod created men and women in His image and created all things for His glory.\nAll have sinned and rebelled against God.\nJesus came to earth, lived a perfect life, and died an atoning death—conquering sin, Satan, and death by His resurrection.\nGod alone is the Author of Salvation.\nThe Holy Spirit gives gifts to those who are in Christ.\nThe church consists of all who have trusted Jesus for their eternal salvation.\nHeaven and hell are real places.\nJesus Christ will one day return to establish His kingdom.",
  story_img1:CDN2+"64f940e6e5a13d680b94e3b5_about-square-1.webp", story_img2:CDN2+"673b945c0c151992622b0081_about-square-2.webp",
  story_how_title:"How It Started",
  story_how:"The Austin Stone began in Matt and Jen Carter's small south Austin apartment in 2002. At the first meeting, 10 people squeezed into the Carters' living room and spent time praying for the future of The Austin Stone—longing to be a church rooted in the gospel, one that married the richness of theological truth with deep compassion for the city. During their time together, they prayed Ephesians 3:20 back to God, asking Him to do far more abundantly than they could ever ask or imagine. And He did.",
  story_grown_title:"How We’ve Grown",
  story_grown:"The Austin Stone quickly grew out of that small apartment to a middle school cafeteria on South Congress, and again to Austin High School in just a few years. Today, we’re still at Austin High, but we also meet at five other locations across the city. While our church has expanded, our passion has remained the same. Every ministry and congregation of The Austin Stone is an expression of our original vision—to be a people rooted in biblical truth, propelled by love for those around them.",
  story_going_title:"Where We’re Going",
  story_going:"Over the years, we've sent hundreds to proclaim the gospel throughout the nations, trained thousands to live out their faith in their workplace and at home, equipped parents to care for and lead their children, supported church planters, and partnered with nonprofits to address the needs of those in Austin. And we're not done yet. The prayer that founded our church is still the one that fuels all we do—for God to do far more than we could ask or imagine for His name to be exalted.",
  name_title:"Our City Is Built on Austin Stone",
  name_text:"If you spend enough time in Austin, you're bound to see historic courthouses, churches, and homes built of impossibly white, expertly carved Texas limestone. Around here, that rock is known by another name—Austin stone. All those buildings are an unmistakable part of the landscape, and if you dig deep enough, the stones that form their foundations can be found underneath the city itself. Quite literally, our city is built on Austin stone.\n\nThere's a beautiful parallel between that reality and the picture Peter paints in Scripture of believers being like stones laid on top of one another to build a living temple. Peter details how Jesus is the Cornerstone of His people—the place where God's presence dwells. Peter emphasizes that a church that isn't built on the living and dynamic love of Jesus will never truly flourish.\n\nEstablished in Jesus, our Cornerstone, and located within a city built on Austin stone, our name unites the calling God has placed on our people and the location He's called us to serve. Our hope is for God to work in amazing ways and transform the lives of people in the city of Austin and beyond.",
  quote_ref:"Ephesians 3:20–21 ESV",
  quote:"Now to him who is able to do far more abundantly than all that we ask or think, according to the power at work within us, to him be glory in the church and in Christ Jesus throughout all generations, forever and ever. Amen.",
  pastor1_name:"Pastor Name", pastor1_role:"Senior Pastor", pastor1_img:"",

  location_name:"South — Soshanguve", location_address:"Exact address coming soon", service_times:"Sundays — times coming soon",
  office:"Church Office · 104 E Highland Mall Blvd, Suite 110, Austin, TX 78752", email:"info@austinstone.org", phone:"512.708.8860",
  facebook:"https://www.facebook.com/theaustinstone/", instagram:"https://www.instagram.com/theaustinstone/", youtube:"https://www.youtube.com/@theaustinstone",
  android_url:"", ios_url:""
};
const FALLBACK_SLIDES = ["68fa56a15d7ac8626153654e_home-carousel-slide-1","68fa56aa91137825dc40f1a9_home-carousel-slide-2","68fa56b14b2f26d56ea2c62d_home-carousel-slide-3","68fa56ba6e6c4fcedde8b5c3_home-carousel-slide-4","68fa56c23a6de895bcd70436_home-carousel-slide-5","68fa56ca9180293a460cd248_home-carousel-slide-6"].map((f,i)=>({image_url:IMG+f+".webp",sort:i}));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const li = s => String(s||"").split("\n").filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("");
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt = (s,o) => new Date(s+"T00:00:00").toLocaleDateString("en-ZA", o||{day:"numeric",month:"long",year:"numeric"});
const sb = (SUPABASE_URL.startsWith("http") && window.supabase) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let C = {...D}, slides = FALLBACK_SLIDES, events = [], readings = [], session = null, calMonth = new Date(), timer;

async function load(){
  if(!sb) return;
  try{
    const [a,b,c,d] = await Promise.all([
      sb.from("site_content").select("*"), sb.from("events").select("*").order("event_date"),
      sb.from("slides").select("*").order("sort"), sb.from("readings").select("*").order("sunday_date")]);
    (a.data||[]).forEach(r => { if(r.value !== null && r.value !== "") C[r.key] = r.value; });
    events = b.data||[]; readings = d.data||[]; if((c.data||[]).length) slides = c.data;
    session = (await sb.auth.getSession()).data.session;
  }catch(e){ console.error(e); }
}

/* ---------- pages ---------- */
const eventCard = e => `<a class="card" href="#/event/${e.id}"><div class="date"><b>${new Date(e.event_date+"T00:00:00").getDate()}</b>${fmt(e.event_date,{month:"short"})}</div><div><h3>${esc(e.title)}</h3><span class="msg">${esc(e.short_description)}</span></div></a>`;

function home(){
  const today = iso(new Date()), up = events.filter(e => e.event_date >= today).slice(0,6);
  return `
  <header class="hero" style="background:linear-gradient(rgba(25,25,112,.55),rgba(25,25,112,.75)),url('${esc(C.hero_img)}') center/cover"><div class="wrap"><h1><span>${esc(C.hero1)}</span><span>${esc(C.hero2)}</span><span>${esc(C.hero3)}</span><span>${esc(C.hero4)}</span></h1>
    <p>${esc(C.hero_invite)}</p><div class="btns"><a class="btn" href="#/visit">Visit</a><a class="btn ghost" href="#/calendar">Get Involved</a></div></div></header>
  <section><div class="wrap split"><div><p class="msg">${esc(C.welcome_label)}</p><h2>${esc(C.welcome_title)}</h2>
    <div class="btns"><a class="btn" href="#/visit">Visit</a><a class="btn ghost" href="#/about">About Us</a></div></div>
    <img src="${esc(C.welcome_img)}" alt="${esc(C.welcome_label)}"></div></section>
  <div class="slides" id="slides">${slides.map((s,i)=>`<img class="${i?"":"on"}" src="${esc(s.image_url)}" alt="">`).join("")}</div>
  <section><div class="wrap"><h2>${esc(C.hap_title)}</h2><p>${esc(C.hap_text)}</p>
    <div class="cards">${up.map(eventCard).join("") || '<p class="msg">New events will appear here soon.</p>'}</div>
    <div class="btns"><a class="btn" href="#/calendar">Get Involved</a></div></div></section>
  <section class="series" style="background-image:url('${esc(C.series_img)}')"><div class="wrap"><p>${esc(C.series_label)}</p><h2>${esc(C.series_title)}</h2><p style="max-width:560px">${esc(C.series_text)}</p>
    <a class="btn" href="#/readings">Explore Series</a></div></section>
  <section><div class="wrap split"><img src="${esc(C.welcome2_img)}" alt=""><div><h2>${esc(C.welcome2_title)}</h2><p>${esc(C.welcome2_text)}</p>
    <div class="btns"><a class="btn" href="#/visit">Visit</a><a class="btn ghost" href="#/calendar">Get Involved</a></div></div></div></section>
  <section class="band"><div class="wrap"><h2>${esc(C.advent_title)}</h2><p>${esc(C.advent_text)}</p><a class="btn" href="#/calendar">Learn more</a></div></section>`;
}

function about(){

  return `
  <header class="hero" style="background:linear-gradient(rgba(25,25,112,.8),rgba(25,25,112,.8)),url('${esc(C.about_hero_img)}') center/cover"><div class="wrap"><h1>About ${esc(C.hero4)}</h1><p>${esc(C.about_established)}</p><p>${esc(C.about_lead)}</p></div></header>
  <section><div class="wrap" style="max-width:780px"><h2>${esc(C.who_title)}</h2><p>${esc(C.who_text)}</p></div></section>
  <section class="soft"><div class="wrap"><h2 style="text-align:center">Our Pastors</h2><div class="circles">${p(C.pastor1_name,C.pastor1_role,C.pastor1_img)}${p(C.pastor2_name,C.pastor2_role,C.pastor2_img)}</div></div></section>
  <section><div class="wrap split"><div><h2>Our Foundational Beliefs</h2><h3>Our Convictions</h3><ul class="tick">${li(C.convictions)}</ul></div><div><h3>Affirmation of Faith</h3><ul class="tick">${li(C.faith)}</ul></div></div></section>
  <section class="soft"><div class="wrap"><h2>The Story of ${esc(C.hero4)}</h2>

    <h3>${esc(C.story_how_title)}</h3><p>${esc(C.story_how)}</p><h3>${esc(C.story_grown_title)}</h3><p>${esc(C.story_grown)}</p><h3>${esc(C.story_going_title)}</h3><p>${esc(C.story_going)}</p></div></section>
  <section><div class="wrap" style="max-width:780px"><h2>${esc(C.name_title)}</h2><p class="pre">${esc(C.name_text)}</p><h3>${esc(C.quote_ref)}</h3><blockquote>${esc(C.quote)}</blockquote></div></section>`;

const visit = () => `<section><div class="wrap" style="max-width:780px"><h1>Visit Us</h1><h2>${esc(C.location_name)}</h2><p>${esc(C.location_address)}</p><p>${esc(C.service_times)}</p>
  <p>${esc(C.hero_invite)}</p><div class="btns"><a class="btn" href="mailto:${esc(C.email)}">Contact us</a></div></div></section>`;

function eventPage(id){
  const e = events.find(x => String(x.id) === String(id));
  if(!e) return `<section><div class="wrap"><h2>Event not found</h2><a href="#/calendar">Back to calendar</a></div></section>`;
  return `<section><div class="wrap" style="max-width:780px"><a href="#/calendar">← Back to calendar</a><p class="msg" style="margin-top:20px">${fmt(e.event_date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
    <h1>${esc(e.title)}</h1>${e.image_url?`<img src="${esc(e.image_url)}" alt="" style="border-radius:14px;margin:20px 0">`:""}<p class="pre">${esc(e.full_description||e.short_description)}</p></div></section>`;
}

function calendar(){
  // Only a one-year window is available: 6 months back to 6 months ahead.
  const now = new Date(), min = new Date(now.getFullYear(), now.getMonth()-6, 1), max = new Date(now.getFullYear(), now.getMonth()+6, 1);
  if(calMonth < min) calMonth = min; if(calMonth > max) calMonth = max;
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  let cells = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="h">${d}</div>`).join("") + "<div style='border:0'></div>".repeat(first);
  for(let d=1; d<=days; d++){
    const key = iso(new Date(y,m,d));
    cells += `<div><b>${d}</b>${events.filter(e=>e.event_date===key).map(e=>`<a href="#/event/${e.id}">${esc(e.title)}</a>`).join("")}</div>`;
  }
  return `<section><div class="wrap"><h1>Church Calendar</h1><div class="calhead"><button class="btn sm" data-act="prev" ${calMonth<=min?"disabled":""}>← Previous</button>
    <h2 style="margin:0">${calMonth.toLocaleDateString("en-ZA",{month:"long",year:"numeric"})}</h2><button class="btn sm" data-act="next" ${calMonth>=max?"disabled":""}>Next →</button></div>
    <div class="cal">${cells}</div><p class="msg">Showing events from ${min.toLocaleDateString("en-ZA",{month:"long",year:"numeric"})} to ${max.toLocaleDateString("en-ZA",{month:"long",year:"numeric"})}.</p></div></section>`;
}

function readingsPage(){
  const today = iso(new Date()); let marked = false;
  return `<section><div class="wrap" style="max-width:780px"><h1>${esc(C.series_title)}</h1><p>${esc(C.series_text)}</p><h2>Sunday readings</h2>
  ${readings.map(r => { const now = !marked && r.sunday_date >= today; if(now) marked = true;
    return `<div class="read ${now?"now":""}"><div><b>${fmt(r.sunday_date,{day:"numeric",month:"short",year:"numeric"})}</b>${now?"<br><small>This Sunday</small>":""}</div><div>${esc(r.scripture)}${r.notes?`<br><small>${esc(r.notes)}</small>`:""}</div></div>`; }).join("") || '<p class="msg">Readings will appear here.</p>'}
  </div></section>`;
}

const appPage = () => { const b=(u,t)=>u?`<a class="btn" href="${esc(u)}">${t}</a>`:`<span class="btn ghost" style="opacity:.5">${t} — coming soon</span>`;
  return `<section><div class="wrap" style="max-width:780px"><h1>Get the app</h1><p>Events, the calendar, and Sunday readings in your pocket.</p><div class="btns">${b(C.android_url,"Download for Android")}${b(C.ios_url,"Download for iPhone")}</div></div></section>`; };

/* ---------- login + admin ---------- */
const loginPage = () => `<section><div class="wrap" style="max-width:420px"><h1>Admin login</h1>
  <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" data-act="login">Log in</button> <p class="msg" id="lmsg"></p></div></section>`;

const TB = { events:[["title"],["event_date","date"],["short_description","area"],["full_description","area"],["image_url","img"]],
             slides:[["image_url","img"],["sort","number"]], readings:[["sunday_date","date"],["scripture"],["notes","area"]] };
const ORDER = {events:"event_date", slides:"sort", readings:"sunday_date"};
const field = (n,type,v,pre="") => {
  const val = esc(v), attr = `data-f="${pre}${n}"`;
  const lab = `<label>${n.replace(/_/g," ")}</label>`;
  if(type==="area") return `${lab}<textarea rows="4" ${attr}>${val}</textarea>`;
  if(type==="img") return `${lab}<input ${attr} value="${val}" placeholder="Image link or upload below"><input type="file" accept="image/*,video/*" data-up>`;
  return `${lab}<input ${attr} type="${type||"text"}" value="${val}">`;
};
async function adminPage(tab="texts"){
  if(!sb || !session) return loginPage();
  const tabs = ["texts","events","slides","readings"].map(t=>`<button class="btn sm ${t===tab?"":"ghost"}" data-act="tab" data-t="${t}">${t==="texts"?"Page text & images":t[0].toUpperCase()+t.slice(1)}</button>`).join("");
  let body = "";
  if(tab==="texts"){
    body = Object.keys(D).map(k => field(k, /_img$/.test(k)?"img":(D[k].length>90?"area":"text"), C[k], "t:")).join("") + `<button class="btn" data-act="savetexts">Save all text</button>`;
  } else {
    const {data} = await sb.from(tab).select("*").order(ORDER[tab]);
    body = (data||[]).map(r => `<div class="row" data-id="${r.id}">${TB[tab].map(([n,t])=>field(n,t,r[n])).join("")}<button class="btn sm" data-act="saverow" data-tb="${tab}">Save</button> <button class="btn sm ghost" data-act="delrow" data-tb="${tab}">Delete</button></div>`).join("")
      + `<div class="row" data-id="">${TB[tab].map(([n,t])=>field(n,t,"")).join("")}<button class="btn sm" data-act="saverow" data-tb="${tab}">Add new</button></div>`;
  }
  return `<section><div class="wrap" style="max-width:820px"><h1>Admin</h1><p><button class="btn sm ghost" data-act="logout">Log out</button></p><div class="tabs">${tabs}</div>${body}</div></section>`;
}

/* ---------- router ---------- */
async function route(){
  const [ , page, arg ] = (location.hash || "#/").slice(1).split("/");
  clearInterval(timer);
  let html;
  switch(page){
    case "about": html = about(); break; case "visit": html = visit(); break;
    case "event": html = eventPage(arg); break; case "calendar": html = calendar(); break;
    case "readings": html = readingsPage(); break; case "app": html = appPage(); break;
    case "login": html = session ? await adminPage() : loginPage(); break;
    case "admin": html = await adminPage(arg||"texts"); break;
    default: html = home();
  }
  $("#app").innerHTML = html; window.scrollTo(0,0);
  const imgs = document.querySelectorAll("#slides img");
  if(imgs.length > 1){ let i = 0; timer = setInterval(()=>{ imgs[i].classList.remove("on"); i=(i+1)%imgs.length; imgs[i].classList.add("on"); }, 4500); }
  $("#navlogin").textContent = session ? "Admin" : "Admin Login"; $("#navlogin").href = session ? "#/admin" : "#/login";
  $("#navlogo").innerHTML = C.logo_img ? `<img src="${esc(C.logo_img)}" alt="${esc(C.hero4)}">` : esc(C.hero4);
  $("#menu").classList.remove("open"); $("#burger").classList.remove("open");
  $("#foot").innerHTML = `<div class="wrap fgrid"><div>${C.logo_img?`<img src="${esc(C.logo_img)}" alt="${esc(C.hero4)}" style="height:56px;margin-bottom:12px">`:`<h3>${esc(C.hero4)}</h3>`}<p>${esc(C.office)}</p><p><a href="mailto:${esc(C.email)}">${esc(C.email)}</a><br><a href="tel:${esc(C.phone)}">${esc(C.phone)}</a></p></div>
    <div><h3>Location</h3><p>${esc(C.location_name)}<br>${esc(C.location_address)}</p></div>
    <div><h3>Follow us</h3><p><a href="${esc(C.facebook)}">Facebook</a><br><a href="${esc(C.instagram)}">Instagram</a><br><a href="${esc(C.youtube)}">YouTube</a></p><p><a href="#/app">Download the app</a></p></div></div>
    <div class="wrap"><p>© ${new Date().getFullYear()} ${esc(C.hero4)}</p></div>`;
}

/* ---------- actions ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if(!b) return; const a = b.dataset.act;
  if(a==="prev"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); return route(); }
  if(a==="next"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); return route(); }
  if(a==="tab") return location.hash = "#/admin/"+b.dataset.t;
  if(a==="login"){
    if(!sb) return $("#lmsg").textContent = "Supabase is not connected yet. Check the keys in index.html.";
    const {data,error} = await sb.auth.signInWithPassword({email:$("#em").value.trim(), password:$("#pw").value});
    if(error) return $("#lmsg").textContent = "Login failed: " + error.message;
    session = data.session; return location.hash = "#/admin";
  }
  if(a==="logout"){ await sb.auth.signOut(); session = null; return location.hash = "#/"; }
  if(a==="savetexts"){
    const rows = [...document.querySelectorAll("[data-f^='t:']")].map(i => ({key:i.dataset.f.slice(2), value:i.value}));
    const {error} = await sb.from("site_content").upsert(rows); if(error) return alert("Save failed: "+error.message);
    await load(); alert("Saved."); return route();
  }
  if(a==="saverow"||a==="delrow"){
    const row = b.closest(".row"), id = row.dataset.id, tb = b.dataset.tb;
    if(a==="delrow"){ if(!confirm("Delete this item?")) return; await sb.from(tb).delete().eq("id",id); }
    else {
      const o = {}; row.querySelectorAll("[data-f]").forEach(i => o[i.dataset.f] = i.value===""?null:i.value);
      const {error} = id ? await sb.from(tb).update(o).eq("id",id) : await sb.from(tb).insert(o);
      if(error) return alert("Save failed: "+error.message);
    }
    await load(); return route();
  }
});
document.addEventListener("change", async ev => {
  const f = ev.target; if(!f.matches("[data-up]") || !f.files[0]) return;
  const file = f.files[0], path = Date.now()+"-"+file.name.replace(/[^\w.-]/g,"_");
  const {error} = await sb.storage.from("media").upload(path, file);
  if(error) return alert("Upload failed: "+error.message);
  f.previousElementSibling.value = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
  alert("Uploaded. Now press Save.");
});
$("#burger").addEventListener("click", () => { const o = $("#menu").classList.toggle("open"); $("#burger").classList.toggle("open", o); $("#burger").setAttribute("aria-expanded", o); });
document.addEventListener("click", e => { if(!e.target.closest("#top")){ $("#menu").classList.remove("open"); $("#burger").classList.remove("open"); } });
window.addEventListener("hashchange", route);
load().then(route);
</script>
</body>
</html>
